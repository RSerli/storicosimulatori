services:
  mysql:
    image: mysql:8.0
    container_name: storicosimulatori_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_simulatori
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: storicosimulatori_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_simulatori
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
