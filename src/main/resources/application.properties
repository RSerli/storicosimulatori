spring.application.name=storicosimulatori

#impostazione della connessione al database
# spring.datasource.url=jdbc:mysql://localhost:3306/db_simulatori
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#iberante
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#create, create-drop, validare, update, none
spring.jpa.hibernate.ddl-auto=update

#DEBUG ONLY
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

#forma date
spring.jackson.date-format=dd-MM-yyyy

#subpath e porta
server.servlet.context-path=/StoricoSimulatori
server.port=8080