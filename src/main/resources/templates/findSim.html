<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap CSS -->
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}" />

    <!-- Custom CSS -->

    <!-- CSS Navbar  -->
    <link th:rel="stylesheet" th:href="@{/css/navbar.css}" />

    <!-- CSS buttonsRow  -->
    <link th:rel="stylesheet" th:href="@{/css/buttonsRow.css}" />

    <title>Simulatori</title>
</head>

<body>

    <header>
        <nav th:replace="fragments/navbar :: navbar"></nav>
    </header>

    <main>
        <div class="container mt-4">
            <h1 class="mb-4">Ricerca Simulazione</h1>

            <form class="row buttonsRow g-3 pb-2 mb-3" th:action="@{/TrovaSimulazione}" method="get">

                <div class="col-md-5">
                    <input type="text" id="nomeImpianto" name="nomeImpianto" class="form-control"
                        th:value="${nomeImpianto}" placeholder="Inserisci nome impianto" />
                </div>

                <div class="col-md-5">
                    <input type="text" id="nomeTecnico" name="nomeTecnico" class="form-control"
                        th:value="${nomeTecnico}" placeholder="Inserisci nome tecnico" />
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn singleButttonStyle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-search" viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                        Cerca
                    </button>
                </div>

            </form>

            <div th:if="${simulazioni == null or #lists.isEmpty(simulazioni)}" class="alert alert-info">
                Nessuna simulazione trovata.
            </div>

            <div th:if="${simulazioni != null and !#lists.isEmpty(simulazioni)}" class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Data</th>
                            <th scope="col">Nome Impianto</th>
                            <th scope="col">Nome Tecnico</th>
                            <th scope="col">Simulatore</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sim : ${simulazioni}">
                            <td th:text="${sim.createdAt}">2026-01-01</td>
                            <td th:text="${sim.nomeImpianto}">Impianto</td>
                            <td th:text="${sim.nomeTencinco}">Tecnico</td>
                            <td
                                th:text="${sim.simulatoreAssociatoImpianto != null ? sim.simulatoreAssociatoImpianto.nomeServer : '-'}">
                                -</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>


    <!-- Bootstrap Bundle -->
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
